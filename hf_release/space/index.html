<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Research demonstration of CT head hemorrhage classification and localization." />
    <title>CT Head Hemorrhage Detection</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f4f6f7;
        --surface: #ffffff;
        --ink: #182126;
        --muted: #637078;
        --line: #d9e0e3;
        --red: #c83238;
        --red-soft: #f8e9e9;
        --teal: #147d79;
        --track: #e7ecee;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      button, a { font: inherit; }
      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        width: min(1440px, 100%);
        min-height: 68px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; }
      .status { color: var(--red); font-size: 13px; font-weight: 700; }
      .links { display: flex; gap: 16px; }
      .links a { color: var(--teal); font-size: 14px; font-weight: 650; text-decoration: none; }
      .warning {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 10px 24px;
        color: #6d292c;
        background: var(--red-soft);
        border-bottom: 1px solid #efcdcf;
        font-size: 13px;
        line-height: 1.45;
      }
      main {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 24px;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 24px;
      }
      .sidebar h2, .predictions h2 {
        margin: 0 0 12px;
        font-size: 14px;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 750;
      }
      .example-list { display: grid; gap: 8px; }
      .example-button {
        width: 100%;
        min-height: 52px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .example-button strong, .example-button span { display: block; }
      .example-button strong { margin-bottom: 2px; font-size: 14px; }
      .example-button span { color: var(--muted); font-size: 12px; }
      .example-button[aria-selected="true"] {
        border-color: var(--red);
        box-shadow: inset 3px 0 0 var(--red);
      }
      .content { min-width: 0; }
      .study-header {
        min-height: 52px;
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 16px;
      }
      .study-header h2 { margin: 0 0 4px; font-size: 18px; }
      .study-header p { margin: 0; color: var(--muted); font-size: 13px; }
      .mode { color: var(--teal); font-size: 13px; font-weight: 700; white-space: nowrap; }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
        gap: 20px;
        align-items: start;
      }
      .images {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #07090a;
      }
      figure img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
      }
      figcaption {
        padding: 9px 11px;
        background: var(--surface);
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      .predictions {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
      }
      .prediction { margin-bottom: 14px; }
      .prediction:last-child { margin-bottom: 0; }
      .prediction-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 5px;
        font-size: 13px;
      }
      .prediction-label strong { font-variant-numeric: tabular-nums; }
      .track { height: 7px; overflow: hidden; border-radius: 3px; background: var(--track); }
      .fill { height: 100%; min-width: 1px; background: var(--teal); }
      .prediction.any .fill { background: var(--red); }
      .footnote {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .error { padding: 28px; color: var(--red); background: var(--surface); border: 1px solid var(--line); }

      @media (max-width: 980px) {
        main { grid-template-columns: 1fr; }
        .example-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .workspace { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        .topbar-inner { align-items: flex-start; flex-direction: column; padding: 14px 16px; }
        .warning, main { padding-left: 16px; padding-right: 16px; }
        .links { flex-wrap: wrap; }
        .example-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .images { grid-template-columns: 1fr; }
        .study-header { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <div class="status">Research demonstration</div>
          <h1>CT Head Hemorrhage Detection</h1>
        </div>
        <nav class="links" aria-label="Project links">
          <a href="https://huggingface.co/ianpan/ct-head-hemorrhage-detection">Model card</a>
          <a href="https://github.com/i-pan/ct-head-hemorrhage-detection">Source</a>
        </nav>
      </div>
    </header>
    <div class="warning"><strong>Not for clinical use.</strong> Outputs are uncalibrated research predictions and must not guide diagnosis, triage, or treatment.</div>
    <main>
      <aside class="sidebar">
        <h2>Heldout examples</h2>
        <div id="example-list" class="example-list"></div>
      </aside>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
    <script>
      const classOrder = ["Epidural", "Intraparenchymal", "Intraventricular", "Subarachnoid", "Subdural", "Any hemorrhage"];
      let examples = [];

      function formatProbability(value) {
        if (value < 0.0001) return "<0.01%";
        return `${(value * 100).toFixed(value < 0.01 ? 2 : 1)}%`;
      }

      function render(index) {
        const item = examples[index];
        document.querySelectorAll(".example-button").forEach((button, buttonIndex) => {
          button.setAttribute("aria-selected", String(buttonIndex === index));
        });
        const rows = classOrder.map((name) => {
          const value = item.probabilities[name];
          const anyClass = name === "Any hemorrhage" ? " any" : "";
          return `<div class="prediction${anyClass}"><div class="prediction-label"><span>${name}</span><strong>${formatProbability(value)}</strong></div><div class="track"><div class="fill" style="width:${Math.max(value * 100, 0.2)}%"></div></div></div>`;
        }).join("");
        document.getElementById("content").innerHTML = `
          <div class="study-header">
            <div><h2>${item.ground_truth}</h2><p>Ground-truth slice label</p></div>
            <div class="mode">Standalone 3-slice model</div>
          </div>
          <div class="workspace">
            <div class="images">
              <figure><img src="${item.brain_image}" alt="Brain-window center CT slice" /><figcaption>Center slice, brain window</figcaption></figure>
              <figure><img src="${item.overlay_image}" alt="Any-hemorrhage segmentation overlay" /><figcaption>Five-fold any-hemorrhage localization</figcaption></figure>
            </div>
            <section class="predictions">
              <h2>Slice classification</h2>
              ${rows}
              <div class="footnote">Continuous segmentation probabilities are shown as a red overlay. The complete-series BiGRU is not run here, so values correspond to the standalone classifier. Examples are curated for qualitative illustration and are not a performance sample.</div>
            </section>
          </div>`;
      }

      fetch("predictions.json")
        .then((response) => {
          if (!response.ok) throw new Error("Prediction data could not be loaded.");
          return response.json();
        })
        .then((data) => {
          examples = data;
          const list = document.getElementById("example-list");
          examples.forEach((item, index) => {
            const button = document.createElement("button");
            button.className = "example-button";
            button.type = "button";
            button.setAttribute("aria-selected", "false");
            button.innerHTML = `<strong>Example ${String(index + 1).padStart(2, "0")}</strong><span>${item.ground_truth}</span>`;
            button.addEventListener("click", () => render(index));
            list.appendChild(button);
          });
          render(0);
        })
        .catch((error) => {
          document.getElementById("content").innerHTML = `<div class="error">${error.message}</div>`;
        });
    </script>
  </body>
</html>
