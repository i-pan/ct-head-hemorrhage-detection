[project]
name = "skp"
version = "0.1.0"
description = "Deep learning experiment framework for rapid prototyping."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
train = [
    "albumentations>=1.4",
    "einops>=0.7",
    "lightning>=2.3",
    "matplotlib>=3.8",
    "mlflow>=2.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.2",
    "petname>=2.9",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "timm>=1.0",
    "torch==2.6.0+cu124",
    "torchmetrics>=1.4",
    "torchvision==0.21.0+cu124",
]
medical = [
    "monai>=1.4",
    "pydicom>=2.4",
]
video = [
    "pytorchvideo>=0.1.5",
]
wds = [
    "webdataset>=0.2.100",
]

[project.scripts]
skp-train = "skp.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skp"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
